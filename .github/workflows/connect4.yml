name: Connect Four
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: connect4
  cancel-in-progress: false
jobs:
  move:
    if: startsWith(github.event.issue.title, 'c4|drop|')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Play the move
        id: play
        env:
          TITLE: ${{ github.event.issue.title }}
          ACTOR: ${{ github.event.issue.user.login }}
          ISSUE: ${{ github.event.issue.number }}
        run: python -m connect4 move --title "$TITLE" --actor "$ACTOR" --issue "$ISSUE"
      - name: Commit the board
        if: steps.play.outputs.accepted == '1'
        env:
          SUBJECT: ${{ steps.play.outputs.subject }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/state.json game/board.svg README.md
          git commit -m "$SUBJECT"
          for i in 1 2 3; do git push && break || (git pull --rebase origin main && sleep 3); done
      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.play.outputs.message }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE" --comment "$MESSAGE See the board at https://github.com/ron2k1"
