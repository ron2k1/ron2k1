name: Snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main, feat/readme-creative]
    paths: [".github/workflows/snake.yml"]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Draws the contribution grid with a snake eating it, one light and one dark file.
      # "#" must be written %23 inside these query strings.
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%23a466d9
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23a466d9
      # The README embeds the files from the output branch, so they never land in main's history.
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
